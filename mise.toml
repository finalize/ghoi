# Ghoi の道具とタスク。
#
# mise は「言語のバージョン」と「タスク」を1か所で見る。
# 道具が増えたら [tools] に足す（web を作る PR で node と pnpm、
# インフラの PR で terraform が増える予定）。
#
#   mise install     [tools] に書いたものを入れる
#   mise tasks       使えるタスクの一覧
#   mise run check   CI と同じ検査

[tools]
go = "1.27"
# state ファイルの互換性に効くので、版は固定する。
# 上げるときは terraform init -upgrade を通し、state の変換を確認してから。
terraform = "1.16.0"

[tasks.dev]
description = "開発用にサーバを起動する（Ctrl-C で終了）"
run = "go run ./cmd/ghoi"

[tasks.fmt]
description = "gofmt をかける"
run = "gofmt -w ."

[tasks.vet]
description = "go vet"
run = "go vet ./..."

[tasks.test]
description = "テスト（競合検出つき）"
run = "go test -race ./..."

[tasks.gofmt-check]
description = "整形されていないファイルが無いか見る"
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt が必要なファイル:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.tf-fmt]
description = "Terraform を整形する"
run = "terraform -chdir=deploy/terraform fmt -recursive"

[tasks.tf-check]
description = "Terraform の整形と構文を確かめる（GCP への接続は不要）"
run = """
cd deploy/terraform
terraform fmt -check -recursive
# 未初期化なら、バックエンド抜きで初期化する（認証情報が無くても通る）
[ -d .terraform ] || terraform init -backend=false -input=false > /dev/null
terraform validate
"""

[tasks.tf-plan]
description = "GCP に何が起きるかを見る（ADC が要る）"
run = """
cd deploy/terraform
terraform init -input=false > /dev/null
terraform plan
"""

[tasks.check]
description = "CI と同じ検査をまとめて走らせる"
depends = ["gofmt-check", "vet", "test", "tf-check"]

[tasks.build]
description = "バイナリを作る（bin/ghoi）"
run = """
version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
go build -ldflags "-X main.version=$version" -o bin/ghoi ./cmd/ghoi
"""

[tasks.clean]
description = "生成物を消す"
run = "rm -rf bin"
